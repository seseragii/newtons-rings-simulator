<html lang="en">
<head>
    <title>newton's rings experiment</title>
    <script src = "rings.js" defer></script>
</head>
<body style="display:flex; gap:40px; align-items: flex-start; user-select: none;">
    <div style="width:700px; flex-shrink:0;">
    <h1 style="margin-top: 0;">Newton's Rings</h1>
<form id="input_data" style="line-height: 2;"> 
  Wavelength of light (in nm.):
  <input type="range" id="wavelength" value="589" min="380" max="780" required oninput="this.nextElementSibling.value = this.value"> 
  <output>589</output>
  <br> 
  
  Radius of curvature (in cm.):
  <input type="range" id="roc" value="100" min="50" max="200" required oninput="this.nextElementSibling.value = this.value"> 
  <output>100</output>
  <br>
Refractive index of film:
  <input type="range" id="rindex" value="1" min="1" max="4" required oninput="this.nextElementSibling.value = this.value"> 
  <output>1</output>
  <br> 
  Crosswire position (in mm.):
  <input type="range" id="crosswire" value="0.00" min="-3.00" max="3.00" step="0.01" required oninput="this.nextElementSibling.value = this.value"> 
  <output>0.00</output>
  <br> 
</form>
  <div id="data"></div>
<canvas id="intensity-graph" width="700" height="200" style="background-color: black;"></canvas>
Intensity vs radial distance graph
</div>
<canvas id="rings" width="700" height="700" style="background-color: black;"></canvas>
</body>
</html>
